<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The share image. `pnpm og` renders it to public/og.png at 1200 by 630. -->
    <style>
      @font-face {
        font-family: 'Bricolage Grotesque';
        font-weight: 200 800;
        src: url('../public/fonts/bricolage-grotesque.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Martian Mono';
        font-weight: 100 800;
        src: url('../public/fonts/martian-mono.woff2') format('woff2');
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      /* The light tokens of src/styles.css. */
      :root {
        --bg: #ebebee;
        --bg-elevated: #ffffff;
        --surface: #f4f4f6;
        --text: #121214;
        --muted: #55555c;
        --ink: #121214;
        --on-ink: #f4f4f6;
        --on-ink-muted: #b4b4bc;
        --accent-fill: #ff3d81;
        --on-accent: #121214;
        --syn-keyword: #9c1f63;
        --syn-string: #2c6a00;
        --syn-function: #1f4fb0;
        --syn-tag: #6b2fb0;
        --syn-attr: #8a4700;
        --syn-type: #006874;
        --syn-number: #8a4700;
        --syn-comment: #5f5f67;
        --syn-punct: #55555c;
        --radius-md: 20px;
        --radius-lg: 28px;
        --font-sans: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
        --font-mono: 'Martian Mono', ui-monospace, 'SF Mono', Menlo, monospace;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
        gap: 12px;
        padding: 12px;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
      }

      .main {
        display: grid;
        align-content: space-between;
        padding: 52px;
        border-radius: var(--radius-lg);
        background: var(--ink);
        color: var(--on-ink);
      }

      .name {
        font-size: 40px;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1;
      }

      h1 {
        font-size: 84px;
        font-weight: 800;
        letter-spacing: -0.05em;
        line-height: 0.94;
      }

      h1 em {
        padding: 0 0.16em 0.04em;
        border-radius: 0.22em;
        background: var(--accent-fill);
        color: var(--on-accent);
        font-style: normal;
      }

      .url {
        color: var(--on-ink-muted);
        font: 400 22px var(--font-mono);
      }

      .side {
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        gap: 12px;
      }

      /* A value and the code seroval writes for it. */
      .code {
        display: grid;
        align-content: center;
        gap: 12px;
        padding: 12px;
        border-radius: var(--radius-lg);
        background: var(--bg-elevated);
        font: 400 16px/1.55 var(--font-mono);
        white-space: pre;
      }

      .panel {
        padding: 14px 20px;
        border-radius: var(--radius-md);
        background: var(--surface);
      }

      .label {
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 15px;
        white-space: normal;
      }

      .date {
        color: var(--syn-attr);
      }

      .set {
        color: var(--syn-type);
      }

      .map {
        color: var(--syn-tag);
      }

      .big {
        color: var(--syn-string);
      }

      .kw {
        color: var(--syn-keyword);
      }

      .stat {
        display: flex;
        align-items: baseline;
        gap: 16px;
        padding: 16px 32px;
        border-radius: var(--radius-lg);
        background: var(--accent-fill);
        color: var(--on-accent);
      }

      .stat b {
        font-size: 64px;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1;
      }

      .stat span {
        font-size: 26px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <section class="main">
      <div class="name">seroval</div>
      <h1>Serialize what JSON <em>can't.</em></h1>
      <div class="url">seroval.vercel.app</div>
    </section>

    <section class="side" aria-hidden="true">
      <div class="code">
        <div class="panel">
          <div class="label">value</div>
          <span class="kw">const</span> a = { tags: <span class="set">new Set(['x'])</span>, id:
          <span class="big">2n</span>, }; a.self = a;
        </div>
        <div class="panel">
          <div class="label">serialize(a)</div>
          (h=&gt;(h={ tags:<span class="set">new Set(["x"])</span>, id:<span class="big">2n</span>},
          h.self=h,h))()
        </div>
      </div>
      <div class="stat"><b>0</b><span>dependencies</span></div>
    </section>
  </body>
</html>
